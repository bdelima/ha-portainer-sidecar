name: Release and publish Docker image

# Pilot for the "build once, version formally, publish to Docker Hub"
# pattern for all the homelab images -- start here, replicate to the
# others once this one's proven out.
#
# Bump the VERSION file and push to main: this creates a matching GitHub
# Release (same pattern as ha-portainer-dashboard's release workflow)
# and, only once that succeeds, builds and pushes a multi-arch image to
# Docker Hub tagged both with that version and `latest`. No separate
# manual release or docker-push step, ever.
#
# One-time setup this workflow depends on (can't be done from a workflow
# file -- these live in Docker Hub's and GitHub's own settings):
#   1. Docker Hub -> Account Settings -> Personal access tokens -> create
#      one scoped to Read & Write for this repo.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret, twice:
#        DOCKERHUB_USERNAME = your Docker Hub username
#        DOCKERHUB_TOKEN    = the access token from step 1 (not your
#                              Docker Hub password)

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from VERSION file
        id: version
        run: echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.check.outputs.exists == 'false'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            bdelima/ha-portainer-sidecar:${{ steps.version.outputs.version }}
            bdelima/ha-portainer-sidecar:latest

      - name: Create tag and GitHub Release
        # Created LAST, after the image is built and pushed: a failed build then never
        # leaves a tag/GitHub release with no image behind it (and a re-run of the
        # same version still works, because no tag exists yet).
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes

