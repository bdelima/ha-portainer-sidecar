<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portainer Sidecar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Items Needing Attention</h1>
    <div class="header-right">
      <span id="last-updated" class="muted"></span>
      <button id="refresh-btn" class="icon-btn" title="Refresh now">⟳</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="updates">Updates <span class="count" id="count-updates">0</span></button>
    <button class="tab" data-tab="trouble">Trouble <span class="count" id="count-trouble">0</span></button>
    <button class="tab" data-tab="stale">Stale <span class="count" id="count-stale">0</span></button>
    <button class="tab" data-tab="cleanup">Cleanup <span class="count" id="count-cleanup">0</span></button>
  </nav>

  <main>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon">✅</div>
      <div>All clear — nothing needs attention.</div>
    </div>

    <section class="panel" data-panel="updates">
      <table class="item-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" data-select-all="updates"></th>
            <th>Container</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows-updates"></tbody>
      </table>
    </section>

    <section class="panel" data-panel="trouble" hidden>
      <table class="item-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows-trouble"></tbody>
      </table>
    </section>

    <section class="panel" data-panel="stale" hidden>
      <table class="item-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" data-select-all="stale"></th>
            <th>Device</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows-stale"></tbody>
      </table>
    </section>

    <!-- (1.3.0) Replaced the old always-visible "Image cleanup" toolbar
         (checkbox-free, un-grouped, always shown above every tab) with a
         proper 4th tab, tree-grouped by endpoint like the others. No
         checkbox column at all -- three ordered, per-endpoint action rows
         (Clean dangling -> Reclaim all images -> Prune unused volumes)
         with immediate per-row buttons, not a multi-select batch model. -->
    <section class="panel" data-panel="cleanup" hidden>
      <table class="item-table">
        <thead>
          <tr>
            <th>Endpoint / action</th>
            <th>Info</th>
          </tr>
        </thead>
        <tbody id="rows-cleanup"></tbody>
      </table>
    </section>
  </main>

  <div id="action-bar" class="action-bar" hidden>
    <span id="selection-count"></span>
    <div class="action-bar-buttons">
      <button id="action-btn" class="primary-btn"></button>
      <button id="clear-selection-btn" class="ghost-btn">Clear</button>
    </div>
  </div>
</div>

<div id="confirm-dialog" class="dialog-backdrop" hidden>
  <div class="dialog">
    <p id="confirm-text"></p>
    <div class="dialog-buttons">
      <button id="confirm-cancel" class="ghost-btn">Cancel</button>
      <button id="confirm-ok" class="danger-btn">Confirm</button>
    </div>
  </div>
</div>

<!-- (1.3.0) Generic info-only dialog -- used by the Trouble tab's More
     Info action (an unstacked container stuck on the network_mode:service
     bug, where there's no remediation to offer, just a fuller explanation
     than fits in the row's short hint). -->
<div id="info-dialog" class="dialog-backdrop" hidden>
  <div class="dialog">
    <p id="info-title" class="dialog-title"></p>
    <p id="info-text"></p>
    <div class="dialog-buttons">
      <button id="info-close" class="ghost-btn">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
